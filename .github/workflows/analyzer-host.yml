name: Analyzer host qualification

on:
  push:
    branches: [main, master, codex/project2-analyzer14]
    paths:
      - 'tools/Ranvier.Analyzers.Host/**'
      - 'tools/Ranvier.Analyzers/**'
      - 'tools/Ranvier.Analyzers.Tests/**'
      - 'build.fsx'
      - 'Directory.Build.*'
      - 'docs/research/native-api-delivery/views-0.1.45-release.json'
      - '.github/workflows/analyzer-host.yml'
  pull_request:
    paths:
      - 'tools/Ranvier.Analyzers.Host/**'
      - 'tools/Ranvier.Analyzers/**'
      - 'tools/Ranvier.Analyzers.Tests/**'
      - 'build.fsx'
      - 'Directory.Build.*'
      - 'docs/research/native-api-delivery/views-0.1.45-release.json'
      - '.github/workflows/analyzer-host.yml'

permissions:
  contents: read

concurrency:
  group: analyzer-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Build the bounded pinned compiler source
        run: python3 tools/Ranvier.Analyzers.Host/build_compiler.py --work artifacts/analyzer-compiler
      - name: Retain the actual compiler output for identity review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-compiler-${{ github.sha }}
          path: artifacts/analyzer-compiler/source/artifacts/bin/FSharp.Compiler.Service/Release/netstandard2.0/FSharp.Compiler.Service.dll
          if-no-files-found: warn
          retention-days: 3
      - name: Retain source identity and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-compiler-diagnostics-${{ github.sha }}
          path: |
            artifacts/analyzer-compiler/*.json
            artifacts/analyzer-compiler/*.log
          retention-days: 3

  core-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ranvier-org/Ranvier
          ref: c9fbaf890a99f2df878968a770c2f3f8c593cdef
          path: .ci/ranvier
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Pack the pinned private DOM dependency closure
        shell: pwsh
        working-directory: .ci/ranvier
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne 'c9fbaf890a99f2df878968a770c2f3f8c593cdef') { throw 'Unexpected Core source revision' }
          $feed = Join-Path $env:GITHUB_WORKSPACE 'artifacts/core-feed'
          foreach ($traced in @('false', 'true')) {
            $outputs = Join-Path $env:GITHUB_WORKSPACE "artifacts/core-build-$traced"
            foreach ($project in @('src/Ranvier.Dom/Ranvier.Dom.fsproj', 'src/Fable.Ranvier.Dom/Fable.Ranvier.Dom.fsproj')) {
              dotnet pack $project -c Release --nologo "-p:RanvierTrace=$traced" --artifacts-path $outputs -o $feed
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          if (git status --porcelain --untracked-files=no) { throw 'Core packing changed tracked source files' }
      - name: Record actual private dependency package identities
        shell: python {0}
        run: |
          import hashlib
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile
          expected = {'Ranvier.Dom', 'Fable.Ranvier.Dom', 'Ranvier.Dom.Traced', 'Fable.Ranvier.Dom.Traced'}
          packages = []
          for path in sorted(Path('artifacts/core-feed').glob('*.nupkg')):
              with zipfile.ZipFile(path) as archive:
                  names = [name for name in archive.namelist() if name.endswith('.nuspec')]
                  if len(names) != 1:
                      raise ValueError('Expected one dependency nuspec')
                  root = ET.fromstring(archive.read(names[0]))
                  values = {node.tag.rsplit('}', 1)[-1]: node.text for node in root.iter()}
              if values['id'] not in expected or values['version'] != '0.1.0-alpha.57':
                  raise ValueError('Unexpected private dependency package identity')
              packages.append({'id': values['id'], 'version': values['version'], 'file': path.name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          if len(packages) != 4 or {package['id'] for package in packages} != expected:
              raise ValueError('The four-package private DOM closure is incomplete')
          Path('artifacts/core-feed/manifest.json').write_text(json.dumps({'source': 'c9fbaf890a99f2df878968a770c2f3f8c593cdef', 'publicQualification': False, 'packages': packages}, indent=2), encoding='utf-8')
      - name: Retain the private dependency closure
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-core-dependencies-${{ github.sha }}
          path: artifacts/core-feed/
          retention-days: 3

  host:
    needs: compiler
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-compiler-${{ github.sha }}
          path: artifacts/compiler
      - name: Pack the owned host with its verified compiler payload
        run: |
          $compiler = (Resolve-Path 'artifacts/compiler/FSharp.Compiler.Service.dll').Path
          dotnet pack tools/Ranvier.Analyzers.Host/Ranvier.Analyzers.Host.csproj -c Release --nologo -o artifacts/feed "-p:RanvierPatchedCompilerPath=$compiler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual startup, default GC policy and tamper rejection
        run: python tools/Ranvier.Analyzers.Host/tests/test_host.py --host-directory tools/Ranvier.Analyzers.Host/bin/Release/net10.0
      - name: Verify producer process cleanup on Windows
        if: runner.os == 'Windows'
        run: python tools/Ranvier.Analyzers.Host/tests/test_build_compiler_supervision.py
      - name: Verify package layout and pinned upstream payload
        run: python tools/Ranvier.Analyzers.Host/tests/test_package.py --package artifacts/feed/Ranvier.Analyzers.Host.0.1.0-preview.1.nupkg --upstream-package artifacts/nuget/fsharp-analyzers/0.41.0/fsharp-analyzers.0.41.0.nupkg
      - name: Verify the external-consumer harness
        run: python tools/Ranvier.Analyzers.Host/tests/test_consumer.py
      - name: Verify publication source and package identity controls
        run: python tools/Ranvier.Analyzers.Host/tests/test_publication.py
      - name: Prepare the isolated analyzer feed configuration
        shell: python {0}
        run: |
          import runpy
          harness = runpy.run_path('tools/Ranvier.Analyzers.Host/tests/test_consumer.py', run_name='feed_configuration')
          harness['write_nuget_config']('artifacts/feed', 'artifacts/analyzer-feed.NuGet.Config')
      - name: Pack the analyzer with its transitive owned host
        run: |
          $config = (Resolve-Path 'artifacts/analyzer-feed.NuGet.Config').Path
          dotnet pack tools/Ranvier.Analyzers/Ranvier.Analyzers.fsproj -c Release --nologo -o artifacts/feed "-p:RestoreConfigFile=$config"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify fresh package-only external consumers
        run: python tools/Ranvier.Analyzers.Host/tests/test_consumer.py --run-external --host-feed artifacts/feed --evidence-dir "${{ runner.temp }}/ranvier-analyzer-consumer-proof" --dotnet dotnet --sdk-version 10.0.403
      - name: Retain external-consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-host-consumers-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ranvier-analyzer-consumer-proof
          if-no-files-found: warn
          retention-days: 3
      - name: Retain qualification packages
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-host-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/feed/*.nupkg
          retention-days: 3

  candidate-consumers:
    needs: host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-host-ubuntu-latest-${{ github.sha }}
          path: artifacts/candidate-feed
      - name: Verify the same candidate package pair on both platforms
        run: python tools/Ranvier.Analyzers.Host/tests/test_consumer.py --run-external --host-feed artifacts/candidate-feed --evidence-dir "${{ runner.temp }}/ranvier-analyzer-candidate-proof" --dotnet dotnet --sdk-version 10.0.403
      - name: Retain candidate consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-candidate-consumers-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ranvier-analyzer-candidate-proof
          if-no-files-found: warn
          retention-days: 3

  analyze:
    needs: [host, core-dependencies]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [library, view, examples]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget
      RestoreConfigFile: ${{ github.workspace }}/artifacts/analyzer-feed.NuGet.Config
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      RANVIER_ANALYZER_HOST_PROVENANCE_DIR: ${{ github.workspace }}/artifacts/analyzer-group-provenance
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-host-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/feed
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-core-dependencies-${{ github.sha }}
          path: artifacts/core-feed
      - name: Configure the exact qualification packages
        shell: python {0}
        run: |
          import runpy
          helper = runpy.run_path('tools/Ranvier.Analyzers.Host/tests/write_repository_nuget_config.py', run_name='repository_configuration')
          from pathlib import Path
          feeds = [{'key': 'private-analyzers', 'path': 'artifacts/feed', 'packageIds': ['Ranvier.Analyzers', 'Ranvier.Analyzers.Host']}, {'key': 'private-dom', 'path': 'artifacts/core-feed', 'packageIds': ['Ranvier.Dom', 'Fable.Ranvier.Dom', 'Ranvier.Dom.Traced', 'Fable.Ranvier.Dom.Traced']}]
          helper['build_repository_config'](Path('nuget.config'), Path('artifacts/analyzer-feed.NuGet.Config'), feeds)
      - name: Run the full repository analyzer group
        run: |
          New-Item -ItemType Directory -Force artifacts/analyzers | Out-Null
          dotnet fsi build.fsx -- analyze --group ${{ matrix.group }} --build 2>&1 | Tee-Object -FilePath artifacts/analyzers/group.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual host identity and SARIF
        run: |
          python tools/Ranvier.Analyzers.Host/tests/test_verify_analyzer_group.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/Ranvier.Analyzers.Host/tests/verify_analyzer_group.py --group ${{ matrix.group }} --project-manifest tools/Ranvier.Analyzers.Host/tests/fixtures/analyzer-groups/${{ matrix.group }}.json --project-root . --report artifacts/analyzers/ranvier-${{ matrix.group }}.sarif --feed artifacts/feed --cache "$env:NUGET_PACKAGES" --provenance-dir "$env:RANVIER_ANALYZER_HOST_PROVENANCE_DIR" --evidence-dir artifacts/analyzer-group-verified --output artifacts/analyzer-group-verified/summary.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain full-group evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-group-${{ matrix.os }}-${{ matrix.group }}-${{ github.sha }}
          path: |
            artifacts/analyzers/
            artifacts/analyzer-group-provenance/
            artifacts/analyzer-group-verified/
          if-no-files-found: warn
          retention-days: 3

  providers:
    needs: [host, core-dependencies]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget
      RestoreConfigFile: ${{ github.workspace }}/artifacts/analyzer-feed.NuGet.Config
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-host-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/feed
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-core-dependencies-${{ github.sha }}
          path: artifacts/core-feed
      - name: Configure the exact qualification packages
        shell: python {0}
        run: |
          import runpy
          helper = runpy.run_path('tools/Ranvier.Analyzers.Host/tests/write_repository_nuget_config.py', run_name='repository_configuration')
          from pathlib import Path
          feeds = [{'key': 'private-analyzers', 'path': 'artifacts/feed', 'packageIds': ['Ranvier.Analyzers', 'Ranvier.Analyzers.Host']}, {'key': 'private-dom', 'path': 'artifacts/core-feed', 'packageIds': ['Ranvier.Dom', 'Fable.Ranvier.Dom', 'Ranvier.Dom.Traced', 'Fable.Ranvier.Dom.Traced']}]
          helper['build_repository_config'](Path('nuget.config'), Path('artifacts/analyzer-feed.NuGet.Config'), feeds)
      - name: Verify the provider qualification controls
        run: python tools/Ranvier.Analyzers.Host/tests/test_provider_qualification.py
      - name: Build the complete provider test executable
        run: |
          dotnet build tools/Ranvier.Analyzers.Tests/Ranvier.Analyzers.Tests.fsproj -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify all 234 tests with the actual compiler identity
        run: |
          $compilerSha = (Get-Content tools/Ranvier.Analyzers.Host/vendor-spec.json -Raw | ConvertFrom-Json).compilerSha256
          python tools/Ranvier.Analyzers.Host/tests/run_provider_qualification.py --dotnet dotnet --project tools/Ranvier.Analyzers.Tests/Ranvier.Analyzers.Tests.fsproj --evidence-dir "${{ runner.temp }}/ranvier-provider-proof" --compiler-sha256 $compilerSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain full provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-providers-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ranvier-provider-proof
          if-no-files-found: warn
          retention-days: 3
