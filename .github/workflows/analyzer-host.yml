name: Analyzer host qualification

on:
  push:
    branches: [codex/project2-analyzer14]
    paths:
      - 'tools/Ranvier.Analyzers.Host/**'
      - '.github/workflows/analyzer-host.yml'
  pull_request:
    paths:
      - 'tools/Ranvier.Analyzers.Host/**'
      - '.github/workflows/analyzer-host.yml'

permissions:
  contents: read

concurrency:
  group: analyzer-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Build the bounded pinned compiler source
        run: python3 tools/Ranvier.Analyzers.Host/build_compiler.py --work artifacts/analyzer-compiler
      - name: Retain the actual compiler output for identity review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-compiler-${{ github.sha }}
          path: artifacts/analyzer-compiler/source/artifacts/bin/FSharp.Compiler.Service/Release/netstandard2.0/FSharp.Compiler.Service.dll
          if-no-files-found: warn
          retention-days: 3
      - name: Retain source identity and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-compiler-diagnostics-${{ github.sha }}
          path: |
            artifacts/analyzer-compiler/*.json
            artifacts/analyzer-compiler/*.log
          retention-days: 3

  host:
    needs: compiler
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-compiler-${{ github.sha }}
          path: artifacts/compiler
      - name: Pack the owned host with its verified compiler payload
        run: |
          $compiler = (Resolve-Path 'artifacts/compiler/FSharp.Compiler.Service.dll').Path
          dotnet pack tools/Ranvier.Analyzers.Host/Ranvier.Analyzers.Host.csproj -c Release --nologo -o artifacts/feed "-p:RanvierPatchedCompilerPath=$compiler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual startup, default GC policy and tamper rejection
        run: python tools/Ranvier.Analyzers.Host/tests/test_host.py --host-directory tools/Ranvier.Analyzers.Host/bin/Release/net10.0
      - name: Verify package layout and pinned upstream payload
        run: python tools/Ranvier.Analyzers.Host/tests/test_package.py --package artifacts/feed/Ranvier.Analyzers.Host.0.1.0-preview.1.nupkg --upstream-package artifacts/nuget/fsharp-analyzers/0.41.0/fsharp-analyzers.0.41.0.nupkg
      - name: Retain qualification packages
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-host-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/feed/*.nupkg
          retention-days: 3
