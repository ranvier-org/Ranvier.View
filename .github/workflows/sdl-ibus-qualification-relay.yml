name: Relay locally qualified SDL IBus evidence

on:
  workflow_dispatch:

jobs:
  relay:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and relay locally executed qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/sdl/relay-qualification.py --work "$RUNNER_TEMP/sdl-ibus-qualification"
      - uses: actions/upload-artifact@v4
        with:
          name: sdl-ibus-local-qualified
          path: ${{ runner.temp }}/sdl-ibus-qualification/
          if-no-files-found: error
