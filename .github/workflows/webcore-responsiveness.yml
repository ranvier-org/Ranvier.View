name: WebCore responsiveness qualification
on:
  workflow_call:
    inputs:
      native_rid:
        type: string
        default: 'all'
      native_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      native_rid:
        type: choice
        default: 'all'
        options: [all, win-x64, linux-x64, osx-arm64]
      native_run:
        description: Ranvier.WebCore build run containing the matching GPU packages
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.native_rid == 'linux-x64' && '[{"os":"ubuntu-24.04","rid":"linux-x64"}]' || inputs.native_rid == 'osx-arm64' && '[{"os":"macos-26","rid":"osx-arm64"}]' || inputs.native_rid == 'win-x64' && '[{"os":"windows-2025","rid":"win-x64"}]' || '[{"os":"windows-2025","rid":"win-x64"},{"os":"ubuntu-24.04","rid":"linux-x64"},{"os":"macos-26","rid":"osx-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RANVIER_REQUIRE_PIPELINE: '1'
      RANVIER_REQUIRE_BACKGROUND_SNAPSHOTS: '1'
      RANVIER_REQUIRE_SNAPSHOT_PIXELS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      SDL_VIDEODRIVER: ${{ matrix.rid == 'linux-x64' && 'x11' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux graphics and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            xvfb xauth dbus-x11 fonts-dejavu-core libgl1-mesa-dri \
            libglib2.0-0t64 libharfbuzz0b libjpeg-turbo8 libepoxy0 libgcrypt20 \
            libsoup-3.0-0 libtasn1-6 libxkbcommon0 libxml2 libpng16-16t64 libsqlite3-0 \
            libwebp7 libwebpdemux2 libwebpmux3 libatomic1 libfreetype6 libfontconfig1 libwoff1 libdrm2 libegl1 libgles2
      - name: Download exact native build artifacts
        env:
          NATIVE_RUN: ${{ inputs.native_run }}
          RID: ${{ matrix.rid }}
        shell: bash
        run: |
          gh run download "$NATIVE_RUN" --repo ranvier-org/Ranvier.WebCore --name "package-$RID-gpu" --dir artifacts/packages
          python -I tools/stage-qualification-runtime.py artifacts/packages artifacts/native "$RID"
      - name: Build consumers against the staged runtime
        shell: bash
        run: |
          python -m unittest discover -s tests/Responsiveness -p test_compare.py
          dotnet build tests/Ranvier.View.WebCore.Tests -c Release -p:RanvierWebCoreNativeDir="$PWD/artifacts/native" -o artifacts/tests
          dotnet build tests/Responsiveness -c Release -p:RanvierWebCoreNativeDir="$PWD/artifacts/native" -o artifacts/fixture
          dotnet build tests/SnapshotPerformance -c Release -p:BaselineManaged=true -o artifacts/snapshot-baseline
          dotnet build tests/SnapshotPerformance -c Release -p:RanvierWebCoreNativeDir="$PWD/artifacts/native" -o artifacts/snapshot-candidate
      - name: Run integration and bounded input/presentation traces
        shell: bash
        run: |
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          if [ "$RUNNER_OS" != Linux ]; then unset SDL_VIDEODRIVER; fi
          "${prefix[@]}" dotnet artifacts/tests/Ranvier.View.WebCore.Tests.dll --filter "portable GPU readiness" --summary | tee artifacts/portable.log
          RANVIER_REQUIRE_PIPELINE=0 "${prefix[@]}" dotnet artifacts/tests/Ranvier.View.WebCore.Tests.dll --summary | tee artifacts/integration.log
          "${prefix[@]}" dotnet artifacts/fixture/Responsiveness.dll --scenario typing --seconds 5 --repetitions 1 --lines 1000000 --bounded-ime --gpu-pipeline --output artifacts/qualification
          "${prefix[@]}" dotnet artifacts/fixture/Responsiveness.dll --scenario ime --seconds 5 --repetitions 1 --lines 1000000 --bounded-ime --gpu-pipeline --output artifacts/qualification
          python -c "import json,pathlib; samples=[json.loads((pathlib.Path('artifacts/qualification')/(s+'-1.json')).read_text()) for s in ['typing','ime']]; assert all(s['nativeAbi'] >= 69 and s['gpuPipelineSupported'] and s['imeWindowSupported'] and s['gpuFrames'] > 0 and s['cpuFrames'] == 0 for s in samples), samples"
      - uses: actions/checkout@v7
        with:
          ref: 960fdfa62bc9c35797ae3c95031165a1c5861ab8
          path: artifacts/baseline-source
          persist-credentials: false
      - name: Build fixed benchmark baseline with identical native runtime
        shell: bash
        run: dotnet build artifacts/baseline-source/tests/Responsiveness -c Release -p:RanvierWebCoreNativeDir="$PWD/artifacts/native" -o artifacts/baseline-fixture
      - name: Gate matched CPU typing and long-line cohorts
        shell: bash
        run: |
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          if [ "$RUNNER_OS" != Linux ]; then unset SDL_VIDEODRIVER; fi
          "${prefix[@]}" python tests/Responsiveness/run_comparison.py artifacts/baseline-fixture/Responsiveness.dll artifacts/fixture/Responsiveness.dll --output artifacts/qualification/typing-gate
          "${prefix[@]}" python tests/Responsiveness/run_comparison.py artifacts/baseline-fixture/Responsiveness.dll artifacts/fixture/Responsiveness.dll --scenario long-line --iterations 100 --output artifacts/qualification/long-line-gate
          "${prefix[@]}" python tests/Responsiveness/run_extreme_comparison.py artifacts/fixture/Responsiveness.dll --output artifacts/qualification/extreme-line-gate
          "${prefix[@]}" python tests/SnapshotPerformance/compare.py artifacts/snapshot-baseline/SnapshotPerformance.dll artifacts/snapshot-candidate/SnapshotPerformance.dll --output artifacts/qualification/snapshot-transfer-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-${{ matrix.rid }}
          path: |
            artifacts/native-receipt.json
            artifacts/qualification
            artifacts/*.log
