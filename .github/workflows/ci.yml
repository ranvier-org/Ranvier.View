name: IME171 disposable Windows probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ime:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Enable Japanese on this disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-WinUserLanguageList | ConvertTo-Json -Depth 8 | Out-File ime-before.json -Encoding utf8
          Get-WindowsCapability -Online | Where-Object Name -Like 'Language.Basic~~~ja-JP*' | ConvertTo-Json -Depth 4 | Out-File ime-capability-before.json -Encoding utf8
          $languages = Get-WinUserLanguageList
          if (-not ($languages.LanguageTag | Where-Object { $_ -like 'ja*' })) { $languages.Add('ja-JP') }
          Set-WinUserLanguageList $languages -Force
          $after = Get-WinUserLanguageList
          $after | ConvertTo-Json -Depth 8 | Out-File ime-after.json -Encoding utf8
          if (-not ($after | Where-Object { $_.LanguageTag -like 'ja*' -and $_.InputMethodTips -match '03B5835F-F03C-411B-9CE2-AA23E1171E36' })) { throw 'Japanese TIP was not provisioned' }
      - name: Restore the same SDL runtime used by View
        shell: pwsh
        run: dotnet restore tests/Ranvier.View.WebCore.Tests/Ranvier.View.WebCore.Tests.fsproj
      - name: Exercise real Windows IME through SDL
        shell: pwsh
        run: |
          $dll = Get-ChildItem "$HOME/.nuget/packages/ppy.sdl3-cs" -Recurse -Filter SDL3.dll | Where-Object FullName -Match 'win-x64' | Select-Object -First 1
          if (-not $dll) { throw 'win-x64 SDL3.dll not found' }
          $env:IME_SDL_DLL = $dll.FullName
          $env:IME_RESULT = "$env:GITHUB_WORKSPACE/ime171-result.json"
          python tools/ime171-runner-probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ime171-windows-provider
          path: |
            ime-*.json
            ime-*.log
            ime171-result.json
          if-no-files-found: warn
