name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      gpu_runtime_version:
        description: 'Exact coordinated GPU/managed WebCore version (empty disables the GPU lane)'
        type: string
        default: ''
      gpu_runtime_source:
        description: 'Public NuGet v3 source for the coordinated GPU release'
        type: string
        default: 'https://api.nuget.org/v3/index.json'
      gpu_runtime_package:
        description: 'Windows x64 GPU runtime package ID'
        type: string
        default: 'Ranvier.WebCore.Native.Gpu.win-x64'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Each group is a `test --group` shard of build.fsx: the same checks as local development.
  views:
    name: Views (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [view, sugar, anime, motion, hydration, arms, analyzers]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # global.json pins the SDK; the net8.0 builds (DotnetCost, the packages' second target) need the .NET 8 runtime.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # The playground, the Motion and hydration examples and the anime suites require Node 26 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('**/*.fsproj', '**/Directory.Build.*', 'nuget.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.group }}-
      # The counters suites compile core with RanvierCounters=true, which the published Ranvier package omits.
      - name: Check out the Core revision matching DOM alpha.44
        if: matrix.group == 'view' || matrix.group == 'arms'
        uses: actions/checkout@v7
        with:
          repository: ranvier-org/Ranvier
          ref: d67af9fa9d5dc60318f00152b76d5193c3ff8879
          path: .ci/ranvier
          persist-credentials: false
      - name: Reference the core source for the counters suites
        if: matrix.group == 'view' || matrix.group == 'arms'
        run: dotnet fsi build.fsx -- dev local --ranvier-root "${{ github.workspace }}/.ci/ranvier"
      - name: Run the same view checks as local development
        run: dotnet fsi build.fsx -- test --group ${{ matrix.group }}
      - name: Upload the Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: views-${{ matrix.group }}-playwright
          path: |
            examples/*/playwright-report/
            examples/*/test-results/
          if-no-files-found: ignore

  # The analyzers over the repository's projects, one group per leg, every RAN code an error.
  analyze:
    name: Analyzers (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [library, view, examples]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet fsi build.fsx -- tools
      - name: Build the group and run the analyzers over it
        run: dotnet fsi build.fsx -- analyze --group ${{ matrix.group }} --build
      - name: Upload the SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analyzers-sarif-${{ matrix.group }}
          path: artifacts/analyzers/*.sarif
          if-no-files-found: ignore

  webcore:
    name: WebCore backend (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            arch: X64
          - runner: windows-11-arm
            rid: win-arm64
            arch: ARM64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-webcore-${{ hashFiles('**/*.fsproj', '**/Directory.Build.*', 'nuget.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-webcore-
      - name: Verify the native runner architecture
        run: |
          if ($env:RUNNER_ARCH -ne '${{ matrix.arch }}') { throw "Unexpected runner architecture: $env:RUNNER_ARCH" }
          dotnet --info
      - name: Test Ranvier.View.WebCore.Tests
        run: dotnet test tests/Ranvier.View.WebCore.Tests -c Release
      - name: Shared native API conformance
        run: dotnet fsi build.fsx -- native-api
      - name: Verify wrappers against the restored canonical model and DOM contracts
        if: matrix.rid == 'win-x64'
        run: |
          dotnet build tools/Ranvier.View.WebCore.Generate -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check-webcore-generated.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the native counter example
        run: dotnet build examples/Ranvier.NativeCounter -c Release
      - name: Build the independent Windows UI Automation client
        if: matrix.rid == 'win-x64'
        run: python tools/native-window-probe.py
      - name: Smoke the visible native counter window
        timeout-minutes: 2
        env:
          RANVIER_SMOKE: '1'
          RANVIER_SMOKE_UIA: '1'
          RANVIER_UIA_PROBE: ${{ matrix.rid == 'win-x64' && format('{0}/artifacts/native-window/UiAutomationProbe.exe', github.workspace) || '' }}
        run: dotnet run --project examples/Ranvier.NativeCounter -c Release --no-build
      - name: Publish the NativeAOT smoke app and counter
        run: |
          dotnet publish tests/Ranvier.View.WebCore.AotSmoke -c Release -r ${{ matrix.rid }} -o artifacts/native-aot/smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish examples/Ranvier.NativeCounter -c Release -r ${{ matrix.rid }} -o artifacts/native-aot/counter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/NativeApi.Conformance/Native.fsproj -f net10.0 -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/native-aot/api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the published NativeAOT smoke app
        run: ./artifacts/native-aot/smoke/Ranvier.View.WebCore.AotSmoke.exe
      - name: Shared NativeAOT API conformance
        run: ./artifacts/native-aot/api/Native.exe
      - name: Smoke the published NativeAOT counter window
        timeout-minutes: 2
        env:
          RANVIER_SMOKE: '1'
          RANVIER_SMOKE_UIA: '1'
          RANVIER_UIA_PROBE: ${{ matrix.rid == 'win-x64' && format('{0}/artifacts/native-window/UiAutomationProbe.exe', github.workspace) || '' }}
        run: ./artifacts/native-aot/counter/Ranvier.NativeCounter.exe

  webcore-gpu:
    name: WebCore shared D3D11 presentation (win-x64)
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_runtime_version != ''
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GPU_RUNTIME_VERSION: ${{ inputs.gpu_runtime_version }}
      GPU_RUNTIME_SOURCE: ${{ inputs.gpu_runtime_source }}
      GPU_RUNTIME_PACKAGE: ${{ inputs.gpu_runtime_package }}
      RANVIER_SMOKE: '1'
      RANVIER_SMOKE_GPU: '1'
      RANVIER_SMOKE_UIA: '1'
      RANVIER_UIA_PROBE: ${{ github.workspace }}/artifacts/native-window/UiAutomationProbe.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify GPU package staging and fetch the exact coordinated runtime
        run: |
          python tests/native-window/test_gpu_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fetch-gpu-runtime.py --package "$env:GPU_RUNTIME_PACKAGE" --version "$env:GPU_RUNTIME_VERSION" --source "$env:GPU_RUNTIME_SOURCE" --out artifacts/gpu-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the independent Windows UI Automation client
        run: python tools/native-window-probe.py
      - name: Restore the counter with matching managed interop and GPU native stage
        run: >-
          dotnet restore examples/Ranvier.NativeCounter -r win-x64
          --source "$env:GPU_RUNTIME_SOURCE" --source https://api.nuget.org/v3/index.json
          "-p:RanvierWebCoreNativeVersion=$env:GPU_RUNTIME_VERSION"
          "-p:RanvierWebCoreNativeDir=$env:GITHUB_WORKSPACE/artifacts/gpu-runtime"
      - name: Build the JIT GPU counter
        run: >-
          dotnet build examples/Ranvier.NativeCounter -c Release -r win-x64 --no-restore
          "-p:RanvierWebCoreNativeVersion=$env:GPU_RUNTIME_VERSION"
          "-p:RanvierWebCoreNativeDir=$env:GITHUB_WORKSPACE/artifacts/gpu-runtime"
      - name: Verify visible shared GPU frames, SDL backbuffer and OS accessibility with JIT
        timeout-minutes: 2
        run: dotnet examples/Ranvier.NativeCounter/bin/Release/net10.0/win-x64/Ranvier.NativeCounter.dll
      - name: Publish the NativeAOT GPU counter
        run: >-
          dotnet publish examples/Ranvier.NativeCounter -c Release -r win-x64 --no-restore
          -o artifacts/native-aot/gpu-counter
          "-p:RanvierWebCoreNativeVersion=$env:GPU_RUNTIME_VERSION"
          "-p:RanvierWebCoreNativeDir=$env:GITHUB_WORKSPACE/artifacts/gpu-runtime"
      - name: Verify visible shared GPU frames, SDL backbuffer and OS accessibility with NativeAOT
        timeout-minutes: 2
        run: ./artifacts/native-aot/gpu-counter/Ranvier.NativeCounter.exe

  # macos-26: the osx-arm64 native package needs macOS 26 (decision G12).
  webcore-macos:
    name: WebCore backend (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-webcore-${{ hashFiles('**/*.fsproj', '**/Directory.Build.*', 'nuget.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-webcore-
      # dotnet run, not dotnet test: WebKit on macOS needs the process's main thread, which the tests' own Main hands
      # to the test bodies.
      - name: Test Ranvier.View.WebCore.Tests
        run: dotnet run --project tests/Ranvier.View.WebCore.Tests -c Release
      - name: Shared native API conformance
        run: dotnet fsi build.fsx -- native-api
      - name: Build the native counter example
        run: dotnet build examples/Ranvier.NativeCounter -c Release
      - name: Smoke the visible native counter window
        timeout-minutes: 2
        env:
          RANVIER_SMOKE: '1'
        run: dotnet run --project examples/Ranvier.NativeCounter -c Release --no-build
      - name: Publish the NativeAOT smoke app and counter
        run: |
          dotnet publish tests/Ranvier.View.WebCore.AotSmoke -c Release -r osx-arm64 -o artifacts/native-aot/smoke
          dotnet publish examples/Ranvier.NativeCounter -c Release -r osx-arm64 -o artifacts/native-aot/counter
          dotnet publish tests/NativeApi.Conformance/Native.fsproj -f net10.0 -c Release -r osx-arm64 -p:PublishAot=true -o artifacts/native-aot/api
      - name: Run the published NativeAOT smoke app
        run: ./artifacts/native-aot/smoke/Ranvier.View.WebCore.AotSmoke
      - name: Shared NativeAOT API conformance
        run: ./artifacts/native-aot/api/Native
      - name: Smoke the published NativeAOT counter window
        timeout-minutes: 2
        env:
          RANVIER_SMOKE: '1'
        run: ./artifacts/native-aot/counter/Ranvier.NativeCounter

  webcore-linux:
    name: WebCore backend (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: x11
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-webcore-${{ hashFiles('**/*.fsproj', '**/Directory.Build.*', 'nuget.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-webcore-
      - name: Install native runtime, display and NativeAOT dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            clang zlib1g-dev xvfb xauth dbus-x11 fonts-dejavu-core libgl1-mesa-dri \
            libglib2.0-0t64 libharfbuzz0b libharfbuzz-icu0 libicu74 libjpeg-turbo8 libepoxy0 libgcrypt20 \
            libsoup-3.0-0 libtasn1-6 libxkbcommon0 libxml2 libpng16-16t64 libsqlite3-0 \
            libwebp7 libwebpdemux2 libwebpmux3 libatomic1 libfreetype6 libfontconfig1 libwoff1 libdrm2 libegl1 libgles2
      - name: Test Ranvier.View.WebCore.Tests
        run: xvfb-run -a dotnet run --project tests/Ranvier.View.WebCore.Tests -c Release
      - name: Shared native API conformance
        run: xvfb-run -a dotnet fsi build.fsx -- native-api
      - name: Build the native counter example
        run: dotnet build examples/Ranvier.NativeCounter -c Release
      - name: Smoke the visible native counter window
        timeout-minutes: 2
        env:
          RANVIER_SMOKE: '1'
        run: xvfb-run -a dotnet run --project examples/Ranvier.NativeCounter -c Release --no-build
      - name: Publish the NativeAOT smoke app and counter
        run: |
          dotnet publish tests/Ranvier.View.WebCore.AotSmoke -c Release -r linux-x64 -o artifacts/native-aot/smoke
          dotnet publish examples/Ranvier.NativeCounter -c Release -r linux-x64 -o artifacts/native-aot/counter
          dotnet publish tests/NativeApi.Conformance/Native.fsproj -f net10.0 -c Release -r linux-x64 -p:PublishAot=true -o artifacts/native-aot/api
      - name: Run the published NativeAOT smoke app
        run: ./artifacts/native-aot/smoke/Ranvier.View.WebCore.AotSmoke
      - name: Shared NativeAOT API conformance
        run: xvfb-run -a ./artifacts/native-aot/api/Native
      - name: Smoke the published NativeAOT counter window
        timeout-minutes: 2
        env:
          RANVIER_SMOKE: '1'
        run: xvfb-run -a ./artifacts/native-aot/counter/Ranvier.NativeCounter

  native-api-browser:
    name: Shared browser API conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: dotnet fsi build.fsx -- tools
      - run: dotnet fsi build.fsx -- native-api-browser
      - name: Shared timing document lifetime and browser interoperability
        run: |
          dotnet fickl tests/UserTiming/Browser.fsproj --outDir tests/UserTiming/generated --extension .js --configuration Release
          node tests/UserTiming/browser.mjs

  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and pack the libraries untraced and traced, with Fable sources, and the analyzers
        run: dotnet fsi build.fsx -- pack
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: bin/*.nupkg
          if-no-files-found: error

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet fsi build.fsx -- tools
      - run: dotnet fsi build.fsx -- format --dry-format --quick

  result:
    name: CI result
    needs: [views, analyze, webcore, webcore-gpu, webcore-macos, webcore-linux, native-api-browser, packages, format]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.views.result }} ${{ needs.analyze.result }} ${{ needs.webcore.result }} ${{ needs['webcore-macos'].result }} ${{ needs['webcore-linux'].result }} ${{ needs['native-api-browser'].result }} ${{ needs.packages.result }} ${{ needs.format.result }}
          GPU_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_runtime_version != '' }}
          GPU_RESULT: ${{ needs['webcore-gpu'].result }}
        run: |
          for result in $RESULTS; do
            case "$result" in success) ;; *) exit 1 ;; esac
          done
          if [ "$GPU_ENABLED" = true ]; then
            [ "$GPU_RESULT" = success ] || exit 1
          else
            [ "$GPU_RESULT" = skipped ] || exit 1
          fi
