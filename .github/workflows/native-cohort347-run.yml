name: Run one reviewed public ABI63 consumer

on:
  workflow_call:
    inputs:
      cohort_file: {required: true, type: string}
      rid: {required: true, type: string}
      mode: {required: true, type: string}

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ${{ inputs.rid == 'win-x64' && 'windows-2025' || inputs.rid == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - name: Validate the selected RID before restore
        shell: python {0}
        env:
          COHORT_FILE: ${{ inputs.cohort_file }}
          COHORT_RID: ${{ inputs.rid }}
        run: |
          import json, os, runpy
          from pathlib import Path
          path = Path(os.environ['COHORT_FILE']).resolve()
          root = Path('tools/native-cohort347/inputs').resolve()
          if not path.is_relative_to(root) or path.suffix != '.json':
              raise ValueError('Select a reviewed repository cohort input JSON.')
          gate = runpy.run_path('tools/native-cohort347/verify.py', run_name='cohort_policy')
          gate['load_cohort'](json.loads(path.read_text()), os.environ['COHORT_RID'])
      - name: Install actual Linux consumer prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev xvfb dbus-x11 at-spi2-core libglib2.0-bin fonts-dejavu-core
          sudo apt-get install -y libharfbuzz-icu0 libicu74 libjpeg-turbo8 libepoxy0 libgcrypt20 libsoup-3.0-0 libtasn1-6 libxkbcommon0 libxml2 libpng16-16t64 libsqlite3-0 libwebp7 libwebpdemux2 libwebpmux3 zlib1g libfreetype6 libfontconfig1 libwoff1 libdrm2 libegl1 libgles2 liblcms2-2 libatomic1
      - name: Actual Windows public JIT and strict NativeAOT consumer
        if: runner.os == 'Windows'
        env:
          COHORT_FILE: ${{ inputs.cohort_file }}
          COHORT_RID: ${{ inputs.rid }}
          COHORT_MODE: ${{ inputs.mode }}
        run: python tools/native-cohort347/run.py --cohort "$env:COHORT_FILE" --rid "$env:COHORT_RID" --mode "$env:COHORT_MODE" --output "$env:RUNNER_TEMP/cohort347-$env:COHORT_MODE"
      - name: Actual Linux public JIT and strict NativeAOT consumers and controls
        if: runner.os == 'Linux'
        env:
          COHORT_FILE: ${{ inputs.cohort_file }}
          COHORT_RID: ${{ inputs.rid }}
          COHORT_MODE: ${{ inputs.mode }}
        run: xvfb-run -a python3 tools/native-cohort347/run.py --cohort "$COHORT_FILE" --rid "$COHORT_RID" --mode "$COHORT_MODE" --output "$RUNNER_TEMP/cohort347-$COHORT_MODE"
      - name: Retain exact public graph and runtime receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-cohort347-${{ inputs.rid }}-${{ inputs.mode }}
          path: ${{ runner.temp }}/cohort347-${{ inputs.mode }}/
          retention-days: 3
