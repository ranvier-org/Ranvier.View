name: Published native packages

on:
  workflow_dispatch:
    inputs:
      view_package_version:
        description: 'Exact published Ranvier.View.WebCore version'
        required: true
        type: string
      sdl_package_version:
        description: 'Exact published Ranvier.View.WebCore.Sdl version'
        required: true
        type: string
      native_runtime_version:
        description: 'Exact published coordinated managed/slim/GPU WebCore version'
        required: true
        type: string
      native_abi:
        description: 'Expected ABI of the exact published native runtime cohort'
        required: true
        type: number
      runtime_flavor:
        description: 'Published runtime flavors to verify (all preserves slim and GPU acceptance)'
        required: true
        default: all
        type: choice
        options: [all, slim, gpu]

permissions:
  contents: read

jobs:
  # A release dispatches this workflow as soon as it pushes, before NuGet has indexed the packages.
  indexed:
    name: Wait for NuGet to index the packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VIEW_VERSION: ${{ inputs.view_package_version }}
      SDL_VERSION: ${{ inputs.sdl_package_version }}
    steps:
      - run: |
          set -u
          for attempt in $(seq 1 40); do
            missing=0
            for package in "ranvier.view.webcore:$VIEW_VERSION" "ranvier.view.webcore.traced:$VIEW_VERSION"                            "ranvier.view.webcore.sdl:$SDL_VERSION" "ranvier.view.webcore.sdl.traced:$SDL_VERSION"; do
              id="${package%%:*}"
              version="${package#*:}"
              curl -fsSL "https://api.nuget.org/v3-flatcontainer/$id/index.json" | jq -e --arg v "$version" '.versions | index($v)' >/dev/null || missing=1
            done
            if [ "$missing" = 0 ]; then
              echo "Indexed after $attempt checks"
              exit 0
            fi
            sleep 60
          done
          echo "NuGet did not index the packages in time" >&2
          exit 1

  acceptance:
    name: Published (${{ matrix.trace }}, ${{ matrix.flavor }})
    needs: indexed
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trace: [normal, traced]
        flavor: ${{ fromJSON(inputs.runtime_flavor == 'slim' && '["slim"]' || inputs.runtime_flavor == 'gpu' && '["gpu"]' || '["slim","gpu"]') }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/published-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.trace }}-${{ matrix.flavor }}
      NativeViewPackageVersion: ${{ inputs.view_package_version }}
      NativeSdlPackageVersion: ${{ inputs.sdl_package_version }}
      NativeRuntimePackageVersion: ${{ inputs.native_runtime_version }}
      NativeRuntimeAbi: ${{ inputs.native_abi }}
      RanvierPackageSuffix: ${{ matrix.trace == 'traced' && '.Traced' || '' }}
      UsePublishedGpu: ${{ matrix.flavor == 'gpu' && 'true' || 'false' }}
      RANVIER_SMOKE: '1'
      RANVIER_SMOKE_UIA: '1'
      RANVIER_UIA_PROBE: ${{ github.workspace }}/artifacts/native-window/UiAutomationProbe.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test the package/output verifier without downloading runtimes
        run: python -I tests/native-packages/test_verify_published_native_runtime.py
      - name: Require shared GPU presentation in GPU jobs
        if: matrix.flavor == 'gpu'
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'RANVIER_SMOKE_GPU=1'
      - name: Build the independent OS accessibility client
        run: python tools/native-window-probe.py
      - name: Restore both fixtures from official NuGet into the fresh job cache
        run: |
          foreach ($fixture in @('Smoke', 'Counter')) {
            dotnet restore "tests/native-packages/$fixture/$fixture.fsproj" --configfile tests/native-packages/NuGet.Config -r win-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and verify both JIT outputs
        run: |
          foreach ($fixture in @('Smoke', 'Counter')) {
            $output = "artifacts/published-native/jit/$fixture"
            dotnet build "tests/native-packages/$fixture/$fixture.fsproj" -c Release -r win-x64 --no-restore -o $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $package = if ($fixture -eq 'Smoke') { "Ranvier.View.WebCore$env:RanvierPackageSuffix" } else { "Ranvier.View.WebCore.Sdl$env:RanvierPackageSuffix" }
            $version = if ($fixture -eq 'Smoke') { $env:NativeViewPackageVersion } else { $env:NativeSdlPackageVersion }
            python tools/verify-published-native-runtime.py --assets "tests/native-packages/$fixture/obj/project.assets.json" --output $output --native-version "$env:NativeRuntimePackageVersion" --view-package $package --view-version "$version" --flavor '${{ matrix.flavor }}' --abi "$env:NativeRuntimeAbi"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run the JIT smoke and visible counter with independent accessibility checks
        timeout-minutes: 3
        run: |
          dotnet artifacts/published-native/jit/Smoke/Ranvier.View.WebCore.AotSmoke.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet artifacts/published-native/jit/Counter/Ranvier.NativeCounter.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish and verify both NativeAOT outputs
        run: |
          foreach ($fixture in @('Smoke', 'Counter')) {
            $output = "artifacts/published-native/aot/$fixture"
            dotnet publish "tests/native-packages/$fixture/$fixture.fsproj" -c Release -r win-x64 --no-restore -o $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $package = if ($fixture -eq 'Smoke') { "Ranvier.View.WebCore$env:RanvierPackageSuffix" } else { "Ranvier.View.WebCore.Sdl$env:RanvierPackageSuffix" }
            $version = if ($fixture -eq 'Smoke') { $env:NativeViewPackageVersion } else { $env:NativeSdlPackageVersion }
            python tools/verify-published-native-runtime.py --assets "tests/native-packages/$fixture/obj/project.assets.json" --output $output --native-version "$env:NativeRuntimePackageVersion" --view-package $package --view-version "$version" --flavor '${{ matrix.flavor }}' --abi "$env:NativeRuntimeAbi"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run the published NativeAOT smoke and visible counter
        timeout-minutes: 3
        run: |
          & ./artifacts/published-native/aot/Smoke/Ranvier.View.WebCore.AotSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $counter = (Resolve-Path -LiteralPath ./artifacts/published-native/aot/Counter/Ranvier.NativeCounter.exe).Path
          $stdout = Join-Path (Split-Path -Parent $counter) 'counter.stdout.log'
          $stderr = Join-Path (Split-Path -Parent $counter) 'counter.stderr.log'
          $process = Start-Process -FilePath $counter -WindowStyle Normal -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Preserve restore graphs and executable output evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-native-${{ matrix.trace }}-${{ matrix.flavor }}
          path: |
            tests/native-packages/**/obj/project.assets.json
            artifacts/published-native/**/Ranvier*.deps.json
            artifacts/published-native/**/*.log
          if-no-files-found: ignore

  # The Metal IOSurface transport over the public osx-arm64 GPU runtime, restored from nuget.org into a fresh cache.
  macos-gpu:
    name: Published Metal IOSurface (macOS, ${{ matrix.trace }})
    needs: indexed
    if: inputs.runtime_flavor != 'slim'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trace: [normal, traced]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/published-metal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.trace }}
      NativeViewPackageVersion: ${{ inputs.view_package_version }}
      NativeSdlPackageVersion: ${{ inputs.sdl_package_version }}
      NativeRuntimePackageVersion: ${{ inputs.native_runtime_version }}
      NativeRuntimeAbi: ${{ inputs.native_abi }}
      RanvierPackageSuffix: ${{ matrix.trace == 'traced' && '.Traced' || '' }}
      FIXTURE: tests/native-packages/IOSurface/IOSurface.fsproj
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the test-only native Metal producer
        run: |
          helper=$(python3 -I tests/mac/build_metal_input.py --output "$RUNNER_TEMP/metal-input")
          echo "RANVIER_MAC_INPUT_HELPER=$helper" >> "$GITHUB_ENV"
      - name: Restore the fixture from official NuGet into the fresh job cache
        run: dotnet restore "$FIXTURE" --configfile tests/native-packages/NuGet.Config -r osx-arm64
      - name: Publish and verify the NativeAOT output
        run: |
          dotnet publish "$FIXTURE" -c Release -r osx-arm64 --no-restore -o artifacts/published-native/aot/IOSurface
          python3 tools/verify-published-native-runtime.py --rid osx-arm64 --assets tests/native-packages/IOSurface/obj/project.assets.json --output artifacts/published-native/aot/IOSurface --native-version "$NativeRuntimePackageVersion" --view-package "Ranvier.View.WebCore$RanvierPackageSuffix" --view-version "$NativeViewPackageVersion" --flavor gpu --abi "$NativeRuntimeAbi"
      - name: Run the published NativeAOT IOSurface consumer
        shell: bash
        timeout-minutes: 3
        run: |
          ./artifacts/published-native/aot/IOSurface/Ranvier.View.WebCore.Tests | tee artifacts/published-native/aot/IOSurface/iosurface.log
          grep -qx 'DYNAMIC_CODE_SUPPORTED=False' artifacts/published-native/aot/IOSurface/iosurface.log
          grep -qx 'IOSURFACE_STATIC_PASS cases=4 unsupported=1 assertions=53' artifacts/published-native/aot/IOSurface/iosurface.log
      - name: Preserve the restore graph and executable output evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-metal-${{ matrix.trace }}
          path: |
            tests/native-packages/IOSurface/obj/project.assets.json
            artifacts/published-native/**/*.log
            ${{ runner.temp }}/metal-input/metal-input-build.json
          if-no-files-found: ignore
